# Corrected workflow for the CI/CD lecture (2026-10 edit, not yet run end to end).
# Fixes against the version attached to the lecture:
#  - the image name is built from github.repository and lower-cased, because
#    registry image names must be lower case (an owner name with a capital letter failed the build);
#  - the owner name was repeated in the old tag (ghcr.io/OWNER/abohmeed/...);
#  - the job asks for packages: write so GITHUB_TOKEN may push to ghcr.io;
#  - images are pushed on main only, not on pull requests.
name: Docker Image CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Lower-case the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
